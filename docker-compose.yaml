services:

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    ports:
      - "3000:3000"

    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}

    depends_on:
      backend:
        condition: service_started


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    ports:
      - "8000:8000"

    environment:
      DATABASE_URL: ${DATABASE_URL}

    depends_on:
      postgres:
        condition: service_healthy


  backend-tests:
    build:
      context: ./backend
      dockerfile: Dockerfile

    environment:
      TEST_DATABASE_URL: ${TEST_DATABASE_URL}

    command: python -m pytest -v

    working_dir: /app

    depends_on:
      postgres:
        condition: service_healthy


  postgres:
    image: postgres:18

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shopadmindb"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s


volumes:
  postgres_data: